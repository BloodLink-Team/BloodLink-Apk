name: Build BloodLink APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Android SDK packages
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: rm -f android/local.properties
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      # Always: debug APK for quick testing
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: BloodLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Only when the signing secrets are set: signed release AAB (Play Store) + release APK
      - name: Build signed release AAB and APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          BLOODLINK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BLOODLINK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BLOODLINK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export BLOODLINK_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease assembleRelease
        working-directory: android
      - name: Upload release AAB
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: BloodLink-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: BloodLink-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
